services:
  mapminer:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./gmapsdata:/app/gmapsdata
    environment:
      - PYTHONUNBUFFERED=1
      - MAPMINER_OUTPUT_DIR=/app/outputs
      - PYTHONPATH=/app
    restart: unless-stopped
    shm_size: '2gb'
